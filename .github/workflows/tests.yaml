# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: tests.yaml

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Speeds up package installation on Linux

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("testthat", "dplyr", "stringr", "R6", "ggplot2", "gridExtra"))'

      - name: Run tests
        # This tells testthat to run all scripts inside the "tests" folder
        run: Rscript -e 'testthat::test_dir("tests", reporter = c("check", "fail"))'
